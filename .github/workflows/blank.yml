name: Comprehensive Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

  setup-environment:
    name: Setup Environment
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: setup-environment
    steps:
      - name: Install Dependencies
        run: npm install

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - name: Build Application
        run: npm run build

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Linter
        run: npm run lint

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Execute Unit Tests
        run: npm test

  performance-tests:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Run Performance Tests
        run: npm run test:performance

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Security Audit
        run: npm audit --production

  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Generate Documentation
        run: npm run docs

      - name: Upload Documentation
        uses: actions/upload-artifact@v3
        with:
          name: generated-docs
          path: ./docs

  manual-approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: [unit-tests, performance-tests, security-scan, generate-docs]
    steps:
      - name: Await Approval
        run: echo "Awaiting manual approval for deployment..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: manual-approval
    steps:
      - name: Deploy to Production
        run: echo "Deploying application to production..."
