version: 2.1
executors:
  default-executor:
    docker:
      - image: cimg/base:current
    working_directory: ~/project

jobs:
  build:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Build
          command: echo "Building the project..."

  compile:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Compile
          command: echo "Compiling the source code..."

  test:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Run Tests
          command: echo "Running tests..."

  deploy:
    executor: default-executor
    steps:
